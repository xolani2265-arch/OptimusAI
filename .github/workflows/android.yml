name: Build Optimus Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Diagnose Android SDK
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          java -version
          find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f -name sdkmanager -print 2>/dev/null || true
          find "$ANDROID_HOME" -maxdepth 4 -type d -name "build-tools" -print 2>/dev/null || true
          find "$ANDROID_HOME" -maxdepth 4 -type d -name "platforms" -print 2>/dev/null || true

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found on the GitHub runner."
            exit 1
          fi
          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --version
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;35.0.0"

      - name: Validate Gradle configuration
        run: gradle --no-daemon tasks --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::APK was not produced."
            exit 1
          fi
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          APKTOOL="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit 2>/dev/null || true)"
          if [ -n "$APKTOOL" ]; then
            "$APKTOOL" verify --verbose "$APK"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: optimus-ai-android13-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
