name: Build Optimus Android Release
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found on the GitHub runner."
            exit 1
          fi
          SDK_BIN="$(dirname "$SDKMANAGER")"
          echo "$SDK_BIN" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --version
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;35.0.0"

      - name: Prepare release signing key
        shell: bash
        env:
          OPTIMUS_KEYSTORE_BASE64: ${{ secrets.OPTIMUS_KEYSTORE_BASE64 }}
          OPTIMUS_KEYSTORE_PASSWORD: ${{ secrets.OPTIMUS_KEYSTORE_PASSWORD }}
          OPTIMUS_KEY_PASSWORD: ${{ secrets.OPTIMUS_KEY_PASSWORD }}
          OPTIMUS_KEY_ALIAS: ${{ secrets.OPTIMUS_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${OPTIMUS_KEYSTORE_BASE64:?Missing OPTIMUS_KEYSTORE_BASE64 repository secret}"
          : "${OPTIMUS_KEYSTORE_PASSWORD:?Missing OPTIMUS_KEYSTORE_PASSWORD repository secret}"
          : "${OPTIMUS_KEY_PASSWORD:?Missing OPTIMUS_KEY_PASSWORD repository secret}"
          : "${OPTIMUS_KEY_ALIAS:?Missing OPTIMUS_KEY_ALIAS repository secret}"
          echo "$OPTIMUS_KEYSTORE_BASE64" | base64 --decode > "${RUNNER_TEMP}/optimus-release.keystore"
          test -s "${RUNNER_TEMP}/optimus-release.keystore"
          echo "OPTIMUS_KEYSTORE_PATH=${RUNNER_TEMP}/optimus-release.keystore" >> "$GITHUB_ENV"
          echo "OPTIMUS_KEY_ALIAS=$OPTIMUS_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "OPTIMUS_KEYSTORE_PASSWORD=$OPTIMUS_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OPTIMUS_KEY_PASSWORD=$OPTIMUS_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Validate Gradle configuration
        run: gradle --no-daemon tasks --stacktrace

      - name: Build release APK
        run: gradle --no-daemon assembleRelease --stacktrace

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::Release APK was not produced."
            exit 1
          fi
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          APKTOOL="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print -quit 2>/dev/null || true)"
          if [ -z "$APKTOOL" ]; then
            echo "::error::apksigner was not found."
            exit 1
          fi
          "$APKTOOL" verify --verbose "$APK"
          "$APKTOOL" verify --print-certs "$APK"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: optimus-ai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
